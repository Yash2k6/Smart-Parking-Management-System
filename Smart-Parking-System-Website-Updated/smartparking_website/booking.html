<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book Slot</title><link rel="stylesheet" href="style.css"></head><body><header><b>Smart<span>Park</span></b><nav><a href="dashboard.html">Dashboard</a><a href="parking.html">Parking</a><a href="history.html">Bookings</a></nav></header><main><small>SLOT BOOKING</small><h1>City Center Parking</h1><div class="grid two"><article><h2>Choose Parking Slot</h2><div id="slots" class="slots"></div></article><article><h2>Booking Details</h2><label>Date</label><input type="date" id="date"><label>Duration</label><select id="duration"><option>1</option><option selected>2</option><option>3</option><option>4</option></select><p>Selected Slot: <b id="selected">None</b></p><p>Estimated Fee: <b id="fee">₹0</b></p><button onclick="confirmBooking()">Confirm Booking</button></article></div></main><script>const s=document.getElementById('slots');for(let i=1;i<=24;i++){let b=document.createElement('button');b.textContent='A-'+String(i).padStart(2,'0');if(i%5===0){b.disabled=true;b.className='occupied'}else{b.onclick=()=>{document.querySelectorAll('#slots button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('selected').textContent=b.textContent;document.getElementById('fee').textContent='₹'+(30*document.getElementById('duration').value)}}s.appendChild(b)}function confirmBooking(){if(document.getElementById('selected').textContent==='None')alert('Please select a slot');else location.href='ticket.html'}</script></body></html>
